[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "context-git"
version = "4.0.0"
description = "Git for AI Agent Context — branch, merge, securely sync, drift-check and resume agent state (UACP/1.0)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Sver0411" }]
keywords = ["ai-agents", "agent-handoff", "context", "developer-tools", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control",
]

[project.urls]
Homepage = "https://github.com/Sver0411/ContextGit"
Repository = "https://github.com/Sver0411/ContextGit"
Issues = "https://github.com/Sver0411/ContextGit/issues"
Changelog = "https://github.com/Sver0411/ContextGit/blob/main/CHANGELOG.md"

[project.scripts]
context-git = "context_git.cli:main"

[tool.setuptools.packages.find]
include = ["context_git*"]

[tool.setuptools.package-data]
context_git = ["adapters/*.json"]

[tool.setuptools.data-files]
"share/context-git/schemas" = ["schemas/*.json"]
"share/context-git/references" = ["references/*.md"]
